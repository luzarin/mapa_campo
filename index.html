<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#163b2e">
  <title>Mapa de campo · Peñaflor</title>
  <script>
    if (location.protocol === 'file:') {
      location.replace('https://luzarin.github.io/mapa_campo/');
    }
  </script>
  <link rel="stylesheet" href="./leaflet.css">
  <style>
    :root { font-family: system-ui, sans-serif; color: #163329; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
    header { background: #163b2e; color: white; padding: 10px 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    h1 { font-size: 17px; margin: 0; }
    header small { color: #d9e8df; }
    button { min-height: 44px; padding: 0 12px; border-radius: 8px; border: 0; background: #f6faf7; color: #163329; font: inherit; font-weight: 650; white-space: nowrap; cursor: pointer; }
    .layers { display: flex; flex-wrap: wrap; align-items: center; gap: 0 12px; padding: 0 12px; background: #fff; }
    label { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; min-height: 44px; cursor: pointer; }
    input { width: 17px; height: 17px; margin: 0; }
    .frutales-color { accent-color: #157247; }
    .trigo-color { accent-color: #9b5000; }
    .maiz-color { accent-color: #6940a5; }
    #marcar { margin-left: auto; font-size: 13px; }
    #marcar[aria-pressed="true"] { background: #163b2e; color: white; }
    .punto-form input { display: block; width: 100%; height: 44px; font-size: 16px; margin: 4px 0 8px; }
    .punto-form label { display: block; min-height: 0; }
    .status { margin: 0; padding: 5px 12px 7px; background: #f4f6f3; color: #394f44; font-size: 12px; }
    #mapa { flex: 1; min-height: 0; background: #edf0e9; }
    .ficha strong { display: block; font-size: 16px; margin-bottom: 4px; }
    .ficha small { font-size: 12px; }
    @media (max-width: 360px) { .layers { gap: 0 7px; padding: 0 8px; } }
  </style>
</head>
<body>
  <header>
    <div><h1>Mapa de campo</h1><small>Peñaflor y comunas vecinas</small></div>
    <button type="button" id="ubicacion">Mi ubicación</button>
  </header>
  <div class="layers" role="group" aria-label="Capas de cultivo">
    <label><input type="checkbox" class="frutales-color" value="frutales" checked>Frutales</label>
    <label><input type="checkbox" class="trigo-color" value="trigo" checked>Trigo 2026</label>
    <label><input type="checkbox" class="maiz-color" value="maiz" checked>Maíz 2025</label>
    <button type="button" id="marcar" aria-pressed="false">Marcar punto</button>
  </div>
  <p class="status" id="estado" role="status">Cargando polígonos…</p>
  <main id="mapa" aria-label="Mapa de Peñaflor y comunas vecinas"></main>
  <script src="./leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.6.0/dist/leaflet-rotate.js"
    integrity="sha384-AAtyl9JHQBqlnEErmUPpMUw8Jn8jnk9JO+Crbj5Kni3PWLGTkUWotBj9KQZ5cPIG"
    crossorigin="anonymous"></script>
  <script>
    const status = document.getElementById('estado');
    const map = L.map('mapa', {
      zoomControl: false,
      rotate: true,
      touchRotate: true,
      pitchDrag: false,
      rotateControl: {closeOnZeroBearing: false, visualizePitch: false}
    }).setView([-33.61, -70.88], 12);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    const mark = document.getElementById('marcar');
    const pointStorage = 'mapa-campo-puntos';
    let points = [];
    try {
      points = JSON.parse(localStorage.getItem(pointStorage) || '[]');
    } catch {
      status.textContent = 'No se pudieron leer los puntos guardados.';
    }

    function showPoint({lat, lng, cultivo}) {
      const card = document.createElement('div');
      card.className = 'ficha';
      const name = document.createElement('strong');
      name.textContent = cultivo;
      const coordinates = document.createElement('small');
      coordinates.textContent = lat.toFixed(6) + ', ' + lng.toFixed(6);
      card.append(name, coordinates);
      return L.circleMarker([lat, lng], {
        className: 'punto-guardado', radius: 8, color: '#fff', weight: 2,
        fillColor: '#d23432', fillOpacity: 1, bubblingMouseEvents: false
      }).addTo(map).bindPopup(card);
    }
    points.forEach(showPoint);

    function setMarking(active) {
      mark.setAttribute('aria-pressed', String(active));
      mark.textContent = active ? 'Toca el mapa' : 'Marcar punto';
    }
    mark.addEventListener('click', () => {
      map.closePopup();
      setMarking(mark.getAttribute('aria-pressed') !== 'true');
    });
    map.on('click', ({latlng}) => {
      if (mark.getAttribute('aria-pressed') !== 'true') return;
      setMarking(false);
      const form = document.createElement('form');
      form.className = 'punto-form';
      form.innerHTML = '<label>Cultivo <input type="text" required maxlength="100"></label>' +
        '<button type="submit">Guardar</button><p role="status"></p>';
      form.addEventListener('submit', event => {
        event.preventDefault();
        const input = form.querySelector('input');
        const cultivo = input.value.trim();
        if (!cultivo) {
          input.value = '';
          input.reportValidity();
          return;
        }
        const point = {lat: latlng.lat, lng: latlng.lng, cultivo};
        const updated = [...points, point];
        try {
          localStorage.setItem(pointStorage, JSON.stringify(updated));
        } catch {
          form.querySelector('[role="status"]').textContent = 'El navegador no pudo guardar el punto.';
          return;
        }
        points = updated;
        showPoint(point).openPopup();
      });
      L.popup().setLatLng(latlng).setContent(form).openOn(map);
    });
    const streets = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    const satellite = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 19, attribution: '&copy; <a href="https://maps.google.com/">Google</a>'
    });
    L.control.layers({'Calles': streets, 'Google Satélite': satellite}, {}, {
      collapsed: false
    }).addTo(map);
    const boundary = L.geoJSON(null, {
      style: {color: '#63736a', weight: 1, dashArray: '5 4', fill: false, interactive: false}
    }).addTo(map);
    const colors = {frutales: '#157247', trigo: '#9b5000', maiz: '#6940a5'};
    const orchardGroups = [
      {color: '#ed7117', species: /^(NARANJO|LIMONERO|MANDARINO|POMELO|LIMA|TANGELO)$/},
      {color: '#087e89', species: /^(NOGAL|ALMENDRO|PISTACHO|PECANA)$/},
      {color: '#b02a68', species: /^(CEREZO|CIRUELO.*|DURAZNERO.*|DAMASCO|NECTARINO|PLUOTS)$/},
      {color: '#157247', species: /^PALTO$/},
      {color: '#2868c7', species: /^VID\b/}
    ];
    function orchardColor(crop) {
      const primarySpecies = crop.split(' / ', 1)[0].toUpperCase();
      return orchardGroups.find(group => group.species.test(primarySpecies))?.color ?? '#64748b';
    }
    const sources = {
      frutales: 'Catastro frutícola',
      trigo: 'Estimación COTRISA',
      maiz: 'Estimación COTRISA · referencia histórica'
    };
    const overlays = {};
    for (const [key, color] of Object.entries(colors)) {
      overlays[key] = L.geoJSON(null, {
        style: feature => ({
          className: key,
          color: key === 'frutales' ? orchardColor(feature.properties.cultivo) : color,
          weight: 1.2,
          fillOpacity: 0.35
        }),
        onEachFeature(feature, layer) {
          const {cultivo, anio} = feature.properties;
          const popup = document.createElement('div');
          popup.className = 'ficha';
          const title = document.createElement('strong');
          title.textContent = cultivo;
          const detail = document.createElement('small');
          detail.textContent = sources[key] + ' · ' + anio;
          popup.append(title, detail);
          layer.bindPopup(popup);
        }
      }).addTo(map);
    }

    document.querySelectorAll('.layers input').forEach(input => {
      input.addEventListener('change', () => {
        const layer = overlays[input.value];
        if (input.checked) layer.addTo(map);
        else layer.remove();
      });
    });

    let locating = false;
    let followLocation = false;
    let locationLayer;
    map.on('dragstart', () => { followLocation = false; });
    const locate = document.getElementById('ubicacion');
    locate.addEventListener('click', () => {
      if (locating) {
        stopFollowing();
        status.textContent = 'Seguimiento detenido';
        return;
      }
      locating = true;
      followLocation = true;
      locate.textContent = 'Detener';
      status.textContent = 'Buscando tu ubicación…';
      map.locate({watch: true, enableHighAccuracy: true, timeout: 12000});
    });
    function stopFollowing() {
      map.stopLocate();
      locating = false;
      locate.textContent = 'Mi ubicación';
      if (locationLayer) locationLayer.remove();
      locationLayer = null;
    }
    map.on('locationfound', event => {
      if (!locating) return;
      const firstPosition = !locationLayer;
      if (locationLayer) locationLayer.remove();
      locationLayer = L.layerGroup([
        L.circle(event.latlng, {radius: event.accuracy, color: '#1671d5', weight: 1, fillOpacity: 0.1}),
        L.circleMarker(event.latlng, {radius: 7, color: 'white', weight: 2, fillColor: '#1671d5', fillOpacity: 1})
      ]).addTo(map);
      if (followLocation) {
        if (firstPosition) map.setView(event.latlng, 16);
        else map.panTo(event.latlng, {animate: false});
      }
      status.textContent = 'Ubicación en vivo';
    });
    map.on('locationerror', event => {
      if (!locating) return;
      if (event.code === 1) {
        stopFollowing();
        status.textContent = 'Revisa el permiso de ubicación y vuelve a tocar el botón.';
      } else {
        status.textContent = 'Esperando señal de GPS…';
      }
    });

    fetch('./campo.geojson')
      .then(response => {
        if (!response.ok) throw new Error('Capas no disponibles');
        return response.json();
      })
      .then(data => {
        let count = 0;
        for (const feature of data.features) {
          const key = feature.properties.capa;
          if (key === 'comunas') boundary.addData(feature);
          else { overlays[key].addData(feature); count++; }
        }
        if (!locating) {
          map.fitBounds(boundary.getBounds(), {padding: [8, 8]});
          status.textContent = count.toLocaleString('es-CL') + ' polígonos cargados · Toca uno para ver su ficha';
        }
      })
      .catch(() => { status.textContent = 'No se pudieron cargar los polígonos. Recarga la página con conexión.'; });
  </script>
</body>
</html>
